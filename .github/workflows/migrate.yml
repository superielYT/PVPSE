name: Migrate PVPSE mappings
on:
  pull_request:
    paths: [".github/workflows/migrate.yml"]
jobs:
  migrate:
    if: github.head_ref == 'codex/mc-26.1.2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mc-26.1.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Migrate names using the existing 1.21.11 build
        run: gradle migrateMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup
      - name: Switch to official mappings and save migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('build.gradle')
          s=p.read_text()
          s=s.replace('mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"', 'mappings loom.officialMojangMappings()')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java build.gradle
          git commit -m "Migrate PVPSE source names from Yarn to official Mojang mappings"
          git push origin HEAD:codex/mc-26.1.2
