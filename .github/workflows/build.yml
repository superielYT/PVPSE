name: Build PVPSE

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore PVPSE logo
        run: |
          mkdir -p src/main/resources/assets/pvp_hud_client
          base64 --decode assets/transparent-logo.png.b64 > src/main/resources/assets/pvp_hud_client/icon.png

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and validate PvP resource pack
        run: |
          node tools/build-pvp-pack.mjs
          python -m zipfile -t dist/PVPSE-Ignite-16x-1.21.11.zip

      - name: Upload PvP resource pack
        uses: actions/upload-artifact@v4
        with:
          name: PVPSE-Ignite-16x-1.21.11
          path: |
            dist/PVPSE-Ignite-16x-1.21.11.zip
            dist/PVPSE-Ignite-preview.png
          if-no-files-found: error

      - name: Build
        run: gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PVPSE-1.9.0
          path: build/libs/PVPSE-1.9.0.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Release PVPSE v1.9.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0
          name: PVPSE Client v1.9.0
          body_path: RELEASE_NOTES.md
          files: build/libs/PVPSE-1.9.0.jar
          draft: false
          prerelease: false
