name: Build PVPSE

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this version from main after the build passes
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          release_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore PVPSE logo
        run: |
          mkdir -p src/main/resources/assets/pvp_hud_client
          base64 --decode assets/transparent-logo.png.b64 > src/main/resources/assets/pvp_hud_client/icon.png

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and validate PvP resource pack
        run: |
          node tools/build-pvp-pack.mjs
          python -m zipfile -t dist/PVPSE-Ignite-16x-26.1.2.zip

      - name: Upload PvP resource pack
        uses: actions/upload-artifact@v4
        with:
          name: PVPSE-Ignite-16x-26.1.2
          path: |
            dist/PVPSE-Ignite-16x-26.1.2.zip
            dist/PVPSE-Ignite-preview.png
          if-no-files-found: error

      - name: Build
        run: gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PVPSE-${{ steps.version.outputs.version }}
          path: build/libs/PVPSE-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Prepare release notes
        run: awk '/^---$/ {exit} {print}' RELEASE_NOTES.md > build/release-notes.md

      - name: Publish GitHub release
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release PVPSE v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PVPSE Client v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: build/release-notes.md
          files: |
            build/libs/PVPSE-${{ steps.version.outputs.version }}.jar
            dist/PVPSE-Ignite-16x-26.1.2.zip
            dist/PVPSE-Ignite-preview.png
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
