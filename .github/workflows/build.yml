name: Build PVPSE

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore PVPSE logo
        run: |
          mkdir -p src/main/resources/assets/pvp_hud_client
          base64 --decode assets/transparent-logo.png.b64 > src/main/resources/assets/pvp_hud_client/icon.png

      - name: Build
        run: gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PVPSE-1.0.1
          path: build/libs/PVPSE-1.0.1.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Release PVPSE v1.0.1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: PVPSE Client v1.0.1
          body: |
            PVPSE Client update for Fabric 1.21.11 and Java 21.

            Changes:
            - Custom PVPSE controls replace vanilla-looking editor buttons
            - Scrollable and clipped main ClickGUI with scrollbar
            - Corner resize handles and live scale display in the HUD editor
            - Added Cyberpunk, Arctic Frost, and Sakura Night themes
            - Includes the existing premium HUD, profiles, crosshair, feedback, and branding
          files: build/libs/PVPSE-1.0.1.jar
          draft: false
          prerelease: false
