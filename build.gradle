plugins {
    id "net.fabricmc.fabric-loom" version "1.17.12"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

sourceSets {
    radarTest {
        compileClasspath = sourceSets.main.output
        runtimeClasspath = output + compileClasspath + configurations.runtimeClasspath
    }
}

tasks.register("testRadar", JavaExec) {
    dependsOn radarTestClasses
    classpath = sourceSets.radarTest.runtimeClasspath
    mainClass = "com.codex.pvphud.waypoint.RadarMathTest"
}
check.dependsOn testRadar

tasks.register("testRegression", JavaExec) {
    dependsOn radarTestClasses
    classpath = sourceSets.radarTest.runtimeClasspath
    mainClass = "com.codex.pvphud.RegressionTest"
}
check.dependsOn testRegression
