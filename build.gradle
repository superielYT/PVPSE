plugins {
    id "net.fabricmc.fabric-loom" version "1.17.12"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

sourceSets {
    radarTest {
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath + configurations.runtimeClasspath
    }
}

tasks.register("testRadar", JavaExec) {
    dependsOn radarTestClasses
    classpath = sourceSets.radarTest.runtimeClasspath
    mainClass = "com.codex.pvphud.waypoint.RadarMathTest"
}
check.dependsOn testRadar

tasks.register("testRegression", JavaExec) {
    dependsOn radarTestClasses
    classpath = sourceSets.radarTest.runtimeClasspath
    mainClass = "com.codex.pvphud.RegressionTest"
}
check.dependsOn testRegression

// Exercise actual screens and HUD rendering in a disposable singleplayer world.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "pvpse-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
loom.runs.clientGameTest.vmArg("-Dfabric.client.gametest.disableNetworkSynchronizer=true")

// Fabric deletes the game-test directory as a dependency; install fixtures afterwards.
tasks.named("runClientGameTest") {
    doFirst {
        def testDirectory = layout.buildDirectory.dir("run/clientGameTest").get().asFile
        copy {
            from("dist/PVPSE-Ignite-32x-26.1.2.zip")
            into(new File(testDirectory, "resourcepacks"))
        }
        new File(testDirectory, "options.txt").text = 'resourcePacks:["vanilla","file/PVPSE-Ignite-32x-26.1.2.zip"]\n'
    }
}
